{% extends 'gestion/base.html' %}

{% block title %}Login - C&H Refrigeración{% endblock %}
{% block page_title %}INICIO DE SESIÓN{% endblock %}

{% block content %}

<!-- Page breadcrumb -->
<div class="d-flex align-items-center mb-4" style="gap: 8px; font-size: 0.8rem; font-family: 'Courier New', Courier, monospace; color: #888;">
    <a href="{% url 'tablero' %}" style="color: #888; text-decoration: none;">
        <i class="bi bi-speedometer2"></i> TABLERO
    </a>
</div>

<!-- Tarjeta de login -->
<div class="card border-dark shadow-lg" style="border: 1px solid #000; width: 350px; margin: 100px auto; padding: 40px;">
    <div class="card-header bg-dark text-white fw-bold" style="border: 1px solid #333; padding: 20px;">
        <h3 class="mb-0">INICIAR SESIÓN</h3>
    </div>
    
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-bold small" style="color: #fff;">Usuario</label>
                <input type="text" name="username" class="form-control form-control-industrial" required style="background-color: #333; color: #fff;">
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold small" style="color: #fff;">Contraseña</label>
                <input type="password" name="password" class="form-control form-control-industrial" required style="background-color: #333; color: #fff;">
            </div>
            
            <button type="submit" class="btn-guardar w-100">
                <i class="bi bi-door-open me-1"></i> Acceder
            </button>
            
            <div class="text-center mt-3 small" style="color: #666;">
                ¿No tienes cuenta? <a href="#" style="color: #888;">Crear usuario</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
