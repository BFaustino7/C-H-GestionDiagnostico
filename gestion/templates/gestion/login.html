{% extends 'gestion/base.html' %}

{% block title %}Login - C&H Refrigeración{% endblock %}
{% block page_title %}INICIO DE SESIÓN{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-24">
    <!-- Login Card -->
    <div class="card-industrial">
        <!-- Header -->
        <div class="bg-[#1a1a1a] text-white px-6 py-5 border-b-3 border-[#00f900]">
            <h3 class="text-base font-bold tracking-widest uppercase m-0 font-sans
                       flex items-center gap-3">
                <!-- DoorOpen icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="#00f900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 4h3a2 2 0 0 1 2 2v14"/>
                    <path d="M2 20h3"/><path d="M13 20h9"/>
                    <path d="M10 12v.5"/><path d="M13 4.5 19 10l-6 5.5v-3z"/>
                </svg>
                INICIAR SESIÓN
            </h3>
        </div>

        <!-- Body -->
        <div class="p-6">
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="form-group-industrial mb-4">
                    <label for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username"
                           class="input-industrial" required
                           placeholder="Ingrese su usuario">
                </div>

                <div class="form-group-industrial mb-5">
                    <label for="id_password">Contraseña</label>
                    <input type="password" name="password" id="id_password"
                           class="input-industrial" required
                           placeholder="Ingrese su contraseña">
                </div>

                <button type="submit"
                        class="btn-green w-full justify-center text-sm">
                    <!-- LogIn icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Acceder
                </button>

                <div class="text-center mt-4 text-xs text-[#666]">
                    ¿No tienes cuenta?
                    <a href="{% url 'registro' %}" class="text-[#888] hover:text-[#00f900] transition-colors">Crear usuario</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
